[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-yambo"
version = "3.0.0"
description = "YAMBO plugin and workflows for AiiDA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Miki Bonacci, Michael Atambo, Antimo Marrazzo, Prandini Gianluca, Nicola Spallanzani", email = "miki.bonacci@psi.ch" },
]

keywords = ["yambo", "aiida", "workflows"]

classifiers = [
    "Environment :: Plugins",
    "Framework :: AiiDA",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "aiida-quantumespresso>=3.0.0a6,<6.0",
    "aiida_core[atomic_tools]>=2.4.1,<3",
    "h5py",
    "importlib_resources",
    "netcdf4",
    "numpy>=1.20.1",
    "pandas>=2",
    "pyyaml~=6.0",
    "xarray",
    "yambopy @ git+https://github.com/mikibonacci/yambopy@aiida-parsing#egg=yambopy",
    "setuptools>=68",
]

[project.urls]
Homepage = "https://github.com/yambo-code/yambo-aiida"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "versioneer",
    "versioneer[toml]",
]

tests = [
    "pytest",
]

pre-commit = [
    "pre-commit>=3",
    "ruff>=0.5",
]

[project.entry-points."aiida.calculations"]
"yambo.yambo" = "aiida_yambo.calculations.yambo:YamboCalculation"
"yambo.ypp" = "aiida_yambo.calculations.ypp:YppCalculation"

[project.entry-points."aiida.parsers"]
"yambo.yambo" = "aiida_yambo.parsers.parsers:YamboParser"
"yambo.ypp" = "aiida_yambo.parsers.yppparser:YppParser"

[project.entry-points."aiida.workflows"]
"yambo.yambo.yamboconvergence" = "aiida_yambo.workflows.yamboconvergence:YamboConvergence"
"yambo.yambo.yamborestart" = "aiida_yambo.workflows.yamborestart:YamboRestart"
"yambo.yambo.yambowf" = "aiida_yambo.workflows.yambowf:YamboWorkflow"
"yambo.ypp.ypprestart" = "aiida_yambo.workflows.ypprestart:YppRestart"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aiida_yambo*"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "examples", "tests/old_wc.py"]

[tool.ruff.lint]
# Only the errors which break the code: syntax errors, undefined names, invalid comparisons.
# More rules will be added when the code base is formatted.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# undefined names which are known and still to be fixed (see the changelog of the cleanup)
"aiida_yambo/utils/common_helpers.py" = ["F821"]
"aiida_yambo/utils/k_path_utils.py" = ["F821"]
"aiida_yambo/parsers/yppparser.py" = ["F821"]
"aiida_yambo/workflows/ypprestart.py" = ["F821"]
"aiida_yambo/workflows/utils/collectors.py" = ["F821"]
"aiida_yambo/workflows/utils/fittings.py" = ["F821"]
"aiida_yambo/commands/*.py" = ["F821"]
