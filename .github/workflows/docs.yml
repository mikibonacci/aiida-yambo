name: Docs

# Build the MkDocs site and publish it on GitHub Pages at each push to develop (or by hand from the Actions tab).
# One-time setting: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [develop]
    paths: ['docs/**', 'mkdocs.yml', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install 'mkdocs>=1.6' 'mkdocs-material>=9.5'  # the docs are plain Markdown: the package is not needed
      - name: Build the site, warnings are errors (a broken link fails here)
        # the names come from the repository which runs the workflow: nothing is hard-coded, it works in any fork
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_NAME: ${{ github.repository }}
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
