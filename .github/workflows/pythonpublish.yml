# Build and upload the package when a release is created.
# NOTE: PyPI rejects packages with direct URL dependencies: the upload works only when `yambopy`
# (now `yambopy @ git+https://...` in pyproject.toml) is a regular dependency.

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[tests]'
      - name: Run the tests
        run: pytest tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*
