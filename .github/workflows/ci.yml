name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[tests]'
      - name: Run the tests
        # the AiiDA profile of the tests is a temporary one: no database or broker is needed
        run: pytest tests
