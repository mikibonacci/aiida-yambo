[pytest]
filterwarnings =
    ignore::DeprecationWarning:pytz.tzinfo
    ignore::RuntimeWarning:.*numpy.*
    ignore::DeprecationWarning:plumpy.events
    ignore::DeprecationWarning:aiida_yambo.parsers.utils
    ignore::DeprecationWarning:aiida_yambo.calculations.yambo
    ignore::DeprecationWarning:aiida_yambo.calculations.ypp
    ignore::DeprecationWarning:yambopy
    ignore::RuntimeWarning
    ignore::sqlalchemy.exc.SAWarning:aiida.storage
    ignore:Creating AiiDA configuration folder:UserWarning:aiida.manage.configuration.settings
