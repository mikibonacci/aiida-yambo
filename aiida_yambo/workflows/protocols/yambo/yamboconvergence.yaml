default_inputs:
    meta_parameters:
        convergence_thresholds: # in percentage, see conv_thr_units
            kpoints: 10
            Nb_Gcut: 10
            FFTGvecs: 10
        conv_thr_units: '%'
        FFTGvecs: 
            start_ratio: 0.25
            stop_ratio: 0.7
            delta_ratio: 0.1
            max_ratio: 1
        bands: 
            start: 200
            stop: 800
            delta: 100
            max: 2000
            ratio: [10,25,50]
        G_vectors: 
            start: 6
            stop: 18
            delta: 2
            max: 40
        kpoint_density:
            start: 1.25
            stop: 5.0
            delta: 2.0
            max: 10.0
    ywfl:
        protocol: 'fast'
    workflow_settings:
                    {
                        'type': 'cheap',
                        'what': ['gap_GG'],
                        'bands_nscf_update': 'all-at-once',
                        'skip_pre': False,
                    }
    parameters_space: []

default_protocol: fast
protocols:
    fast:
        description: 'Fast protocol for a GW convergence: grid -> poor; thresholds -> poor'
    moderate:
        description: 'Moderate protocol for a GW convergence: grid -> enough good for standard materials; thresholds -> moderate (5 percent)'
        meta_parameters:
            convergence_thresholds:
                kpoints: 5
                Nb_Gcut: 5
                FFTGvecs: 5
            conv_thr_units: 'percentage of relative error'
            bands: {
                'start': 400,
                'stop': 1000,
                'delta': 100,
                'max': 2000,
                'ratio':[5,10,20],
            }
            G_vectors: {
                'start': 6,
                'stop': 20,
                'delta': 2,
                'max': 40,
            }
            kpoint_density: {
                'start': 1.25,
                'stop': 5.0,
                'delta': 2.0,
                'max': 10.0,
            }
        ywfl:
            protocol: 'moderate'
    precise:
        description: 'precise protocol for a GW convergence: grid -> same as moderate; thresholds -> precise (1 percent)'
        meta_parameters:
            convergence_thresholds:
                kpoints: 1
                Nb_Gcut: 1
                FFTGvecs: 1
            conv_thr_units: 'percentage of relative error'
        ywfl:
            protocol: 'moderate'
    molecule:
        description: 'Moderate protocol for a GW convergence in molecules'
        meta_parameters:
            convergence_thresholds:
                kpoints: 10
                Nb_Gcut: 10
                FFTGvecs: 10
            conv_thr_units: 'percentage of relative error'
            bands: {
                'start': 500,
                'stop': 5000,
                'delta': 200,
                'max': 8000,
                'ratio':[5,10,20],
            }
            G_vectors: {
                'start': 10,
                'stop': 24,
                'delta': 2,
                'max': 40,
            }
        ywfl:
            protocol: 'moderate'